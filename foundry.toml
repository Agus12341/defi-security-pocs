[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
eth = "${ETH_RPC_URL}"
bsc = "${BSC_RPC_URL}"
mainnet = "${ETH_RPC_URL}"

[lint]
# Model vault used only in local fuzz tests, not production code.
ignore = ["src/onyx/**/*.sol"]
